name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  OPENDOCUMENTS_PROBE_RETRIES: "1"
  OPENDOCUMENTS_PROBE_DELAY_MS: "0"

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: apps/webui/package-lock.json

      - run: npm ci
        working-directory: apps/webui
      - run: npm run build
        working-directory: apps/webui
