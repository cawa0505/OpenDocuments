[workspace]
resolver = "2"
members = [
    "crates/opendoc-cli",
    "crates/opendoc-types",
    "crates/opendoc-parser",
    "crates/opendoc-parser-xlsx",
    "crates/opendoc-parser-docx",
    "crates/opendoc-parser-pdf",
    "crates/opendoc-parser-text",
    "crates/opendoc-parser-code",
    "crates/opendoc-storage",
    "crates/opendoc-llm",
    "crates/opendoc-tui",
    "crates/opendoc-mcp"
]

[profile.release]
opt-level = 1       # 💡 opt-level = 1 可徹底避開 rustc 在編譯 heavy async (Lance/DataFusion) 時的 layout 遞迴 overflow bug，並能大幅加快 CI 編譯速度與減少記憶體佔用！
codegen-units = 16  # 提升並行編譯度，縮短編譯時間並降低編譯器記憶體峰值
panic = "abort"     # 縮減最終二進位檔體積

[profile.release.package.lance]
opt-level = 0
[profile.release.package.lance-arrow]
opt-level = 0
[profile.release.package.lance-core]
opt-level = 0
[profile.release.package.lance-datafusion]
opt-level = 0
[profile.release.package.lancedb]
opt-level = 0
[profile.release.package.lance-encoding]
opt-level = 0
[profile.release.package.lance-file]
opt-level = 0
[profile.release.package.lance-index]
opt-level = 0
[profile.release.package.lance-io]
opt-level = 0
[profile.release.package.lance-linalg]
opt-level = 0
[profile.release.package.lance-table]
opt-level = 0
[profile.release.package.lance-testing]
opt-level = 0

[profile.dev]
opt-level = 1
panic = "abort"
