[workspace]
members = [
    "crates/opendoc-types",
    "crates/opendoc-parser",
    "crates/opendoc-storage",
    "crates/opendoc-llm",
    "crates/opendoc-mcp",
    "crates/opendoc-cli",
    # 本階段不編譯 TUI：`cargo build --features tui`（opendoc-cli）時才需要，之後再加回
    # "crates/opendoc-tui",
]
resolver = "2"

[profile.release]
opt-level = 0
overflow-checks = false

[profile.release.package.opendoc-types]
opt-level = 2

[profile.release.package.opendoc-parser]
opt-level = 2

[profile.release.package.opendoc-storage]
opt-level = 2

[profile.release.package.opendoc-llm]
opt-level = 2

[profile.release.package.opendoc-mcp]
opt-level = 2

[profile.release.package.opendoc]
opt-level = 2

# 註：opendoc-tui 已暫移出 workspace members（`--features tui` 時需先加回），
#     其 profile 覆寫隨之暫停；待 TUI 回歸時恢復。
