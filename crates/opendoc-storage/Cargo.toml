[package]
name = "opendoc-storage"
version = "0.2.0"
edition = "2021"

[dependencies]
opendoc-types = { path = "../opendoc-types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
directories = "5.0"
async-trait = "0.1"
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "macros"] }
uuid = { version = "1.0", features = ["v4"] }
tokio = { version = "1.0", features = ["full"] }

[features]
default = []
# ponytail: in-process ONNX CPU embedding; off by default to keep build light.
# Upgrade to a pluggable provider if BYOK + fastembed both needed at runtime.
embedding-fastembed = ["dep:fastembed"]

[dependencies.fastembed]
version = "5"
optional = true
