[package]
name = "opendoc-connector-clouddrive"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["time"] }

[dev-dependencies]
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1.0", features = ["rt", "macros"] }
