[package]
name = "opendoc-ai"
version = "1.0.0"
edition = "2021"
description = "Native AI Engine abstraction layer for OpenDocuments"

[dependencies]
opendoc-types = { path = "../opendoc-types" }
opendoc-llm = { path = "../opendoc-llm" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
tokio = { version = "1.0", features = ["sync"] }
