[package]
name = "opendoc-engine-lancedb"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "opendoc-engine-lancedb"
path = "src/main.rs"

[dependencies]
opendoc-types = { path = "../opendoc-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lancedb = { version = "0.23", default-features = false }
arrow-array = "56"
arrow-schema = "56"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "io-util"] }