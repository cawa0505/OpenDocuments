[package]
name = "opendoc"
version = "0.1.0"
edition = "2021"

[dependencies]
opendoc-types = { path = "../opendoc-types" }
opendoc-parser = { path = "../opendoc-parser" }
opendoc-storage = { path = "../opendoc-storage" }
opendoc-mcp = { path = "../opendoc-mcp" }
opendoc-tui = { path = "../opendoc-tui" }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["multipart", "json"] }
walkdir = "2.4"
crossterm = "0.27"
ratatui = "0.26"
chrono = "=0.4.38"
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }
