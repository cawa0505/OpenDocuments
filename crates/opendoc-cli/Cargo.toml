[package]
name = "opendoc"
version = "0.1.0"
edition = "2021"

[dependencies]
opendoc-types = { path = "../opendoc-types" }
opendoc-parser = { path = "../opendoc-parser" }
opendoc-storage = { path = "../opendoc-storage" }
opendoc-mcp = { path = "../opendoc-mcp" }
opendoc-llm = { path = "../opendoc-llm" }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["multipart", "json"] }
walkdir = "2.4"
chrono = "0.4.40"
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }
ignore = "0.4"
sha2 = "0.10"

[features]
default = []
# 離線 ONNX embedding（BGE-M3 1024 維）；預設關閉以保持建置輕量，啟用後 binary 增 ~數十 MB
embedding-fastembed = ["opendoc-storage/embedding-fastembed"]
