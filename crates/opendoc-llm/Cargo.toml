[package]
name = "opendoc-llm"
version = "0.2.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "stream"] }
futures-util = "0.3"
thiserror = "1.0"
async-trait = "0.1"
opendoc-types = { path = "../opendoc-types" }
