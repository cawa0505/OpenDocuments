[package]
name = "opendoc-storage"
version = "0.1.0"
edition = "2021"

[dependencies]
opendoc-types = { path = "../opendoc-types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
directories = "5.0"
async-trait = "0.1"
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "macros"] }
tokio = { version = "1.0", features = ["full"] }
lancedb = "0.10"
arrow-schema = "52.2.0"
