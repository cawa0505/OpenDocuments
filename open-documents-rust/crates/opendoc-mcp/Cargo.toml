[package]
name = "opendoc-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
opendoc-types = { path = "../opendoc-types" }
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["fs", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
futures-util = "0.3"
async-stream = "0.3"
