[package]
name = "open-documents-rust"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "crates/opendoc-types",
    "crates/opendoc-parser",
    "crates/opendoc-parser-xlsx",
    "crates/opendoc-parser-docx",
    "crates/opendoc-parser-pdf",
    "crates/opendoc-parser-text",
    "crates/opendoc-parser-code",
    "crates/opendoc-parser-jupyter",
    "crates/opendoc-parser-email",
    "crates/opendoc-parser-html",
    "crates/opendoc-parser-pptx",
    "crates/opendoc-storage"
]

[dependencies]
opendoc-types = { path = "crates/opendoc-types" }
opendoc-parser = { path = "crates/opendoc-parser" }
opendoc-storage = { path = "crates/opendoc-storage" }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["multipart", "json"] }
walkdir = "2.4"

[profile.release]
opt-level = 3       # 最高級別的編譯優化
lto = true          # 開啟 Link-Time Optimization，減少跨 Crate 呼叫的開銷並縮減體積
codegen-units = 1   # 減少並行編譯單元，雖然編譯變慢，但能讓編譯器做更極致的全局優化
panic = "abort"     # 發生 Panic 時直接中斷，不再保留展開堆疊，能進一步縮減二進位檔大小
